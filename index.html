<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formation Vibecoding : de l'idée au site en ligne. 5 modules autonomes, interactifs et progressifs.">
    <title>Formation Vibecoding — de l'idée au site en ligne</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="skip-link" href="#app">Aller au contenu</a>

    <header class="site-header" id="siteHeader">
        <div class="container header-inner">
            <a href="#/" class="brand">
                <span class="brand-mark">V</span>
                <span class="brand-text">Vibecoding</span>
            </a>
            <nav class="main-nav" aria-label="Navigation principale">
                <ul>
                    <li><a href="#/" data-nav="home">Accueil</a></li>
                    <li><a href="#/dashboard" data-nav="dashboard">Tableau de bord</a></li>
                    <li><a href="#/params" data-nav="params">Paramètres</a></li>
                    <li id="navAuth"></li>
                </ul>
            </nav>
            <button class="theme-toggle" id="themeToggle" aria-label="Basculer le thème clair / sombre" title="Basculer le thème">◐</button>
            <button class="nav-burger" id="navBurger" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="mobileMenu">☰</button>
        </div>
        <div class="mobile-drawer" id="mobileMenu" hidden>
            <ul>
                <li><a href="#/" data-nav="home">Accueil</a></li>
                <li><a href="#/dashboard" data-nav="dashboard">Tableau de bord</a></li>
                <li><a href="#/params" data-nav="params">Paramètres</a></li>
            </ul>
        </div>
    </header>

    <div class="persistent-bar" id="persistentBar">
        <div class="container">
            <div class="persist-label" aria-hidden="true">Progression globale</div>
            <div class="progress-track"><div class="progress-fill" id="persistFill" style="width:0%"></div></div>
            <div class="persist-pct" id="persistPct" aria-hidden="true">0%</div>
        </div>
    </div>

    <main id="app" tabindex="-1"></main>

    <footer class="site-footer">
        <div class="container">
            <p class="footer-brand">Formation Vibecoding</p>
            <p class="footer-note">« Préférer la simplicité à la performance. » — Module 2</p>
            <p class="footer-copy">&copy; 2026. Formation autonome en 5 modules.</p>
        </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/modules/m1.js"></script>
    <script src="js/modules/m2.js"></script>
    <script src="js/modules/m3.js"></script>
    <script src="js/modules/m4.js"></script>
    <script src="js/modules/m5.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
